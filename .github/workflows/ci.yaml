
# GitHub Actions workflow
# GitHub looks for workflow files inside .github/workflows/

# Give workflow a meaningful name
name: Student Performance ML API - CI Pipeline

# Define when GitHub should run this workflow
on:
  # Run CI whenever code is pushed to main
  push:
    branches:
      - main

  # Also validate changes before merging
  pull_request:
    branches:
      - main

# Permissions
permissions:
  contents: read

# Define the jobs that make up the pipeline
jobs:
  test-and-build:
    # GitHub provides a fresh Ubuntu VM
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository content
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Install Python on Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # Step 5: Build Docker image only after tests pass
      - name: Build Docker Image
        run: docker build -t student-performance-api:${{ github.sha }} .
